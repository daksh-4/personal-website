    <script>
        async function loadEssays() {
            let essays = [];
            try {
                if (window.ESSAYS_DATA) {
                    essays = window.ESSAYS_DATA;
                } else {
                    const response = await fetch('essays.json');
                    essays = await response.json();
                }
            } catch (error) {
                console.log('Could not load essays:', error);
            }

            const list = document.getElementById('essay-list');

            essays.sort((a, b) => (b.date || '0000-00').localeCompare(a.date || '0000-00'));

            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                               'July', 'August', 'September', 'October', 'November', 'December'];

            if (essays.length === 0) {
                const empty = document.createElement('li');
                empty.textContent = 'No essays found.';
                list.appendChild(empty);
            } else {
                essays.forEach(essay => {
                    const li = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = essay.url;
                    link.textContent = essay.title;
                    li.appendChild(link);

                    if (essay.date) {
                        const [year, month] = essay.date.split('-');
                        const dateSpan = document.createElement('span');
                        dateSpan.className = 'essay-date';
                        dateSpan.textContent = '- ' + monthNames[parseInt(month, 10) - 1] + ' ' + year;
                        li.appendChild(dateSpan);
                    }

                    list.appendChild(li);
                });
            }

            window._essaysForGraph = essays;
        }

        loadEssays();

        let myGraph = null;

        function toggleView(view) {
            document.getElementById('btn-list').classList.toggle('active', view === 'list');
            document.getElementById('btn-graph').classList.toggle('active', view === 'graph');
            document.getElementById('list-container').style.display = (view === 'list') ? 'block' : 'none';
            document.getElementById('graph-container').style.display = (view === 'graph') ? 'block' : 'none';

            if (view === 'graph') {
                const gc = document.getElementById('graph-container');
                if (myGraph === null) {
                    try { buildGraph(window._essaysForGraph || []); } catch(e) { console.log('Graph error:', e); }
                }
                if (myGraph !== null) {
                    myGraph.width(gc.clientWidth).height(gc.clientHeight);
                    setTimeout(() => myGraph.zoomToFit(400, 80), 50);
                }
            }
        }

        function buildGraph(essays) {
            const coreNodes = ['Tools', 'Work', 'Reflections', 'Reading'];
            const nodes = coreNodes.map(id => ({ id, name: id, group: 'core', val: 8 }));
            const links = [];

            essays.forEach(essay => {
                if (!essay.nodes || essay.nodes.length === 0) return;
                nodes.push({
                    id: essay.url,
                    name: essay.title,
                    group: 'essay',
                    val: 2,
                    url: essay.url
                });
                essay.nodes.forEach(centralNode => {
                    links.push({ source: essay.url, target: centralNode });
                });
                (essay.links || []).forEach(linkedUrl => {
                    links.push({ source: essay.url, target: linkedUrl });
                });
            });

            const gc = document.getElementById('graph-container');
            const W = window.innerWidth;
            const H = window.innerHeight - 200;

            myGraph = ForceGraph()(document.getElementById('graph-container'))
                .width(W)
                .height(H)
                .backgroundColor('#f6f6ef')
                .graphData({ nodes, links })
                .nodeId('id')
                .nodeVal('val')
                .nodeLabel('name')
                .nodeAutoColorBy('group')
                .nodeCanvasObject((node, ctx, globalScale) => {
                    const label = node.name || node.id;
                    const fontSize = node.group === 'core' ? 14 / globalScale : 11 / globalScale;
                    ctx.font = `${node.group === 'core' ? 'bold ' : ''}${fontSize}px Verdana, sans-serif`;
                    const textWidth = ctx.measureText(label).width;
                    const r = node.group === 'core' ? 6 : 3;

                    ctx.beginPath();
                    ctx.arc(node.x, node.y, r, 0, 2 * Math.PI, false);
                    ctx.fillStyle = node.group === 'core' ? '#333' : '#888';
                    ctx.fill();

                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#000';
                    ctx.fillText(label, node.x, node.y + r + fontSize * 0.8);
                })
                .nodePointerAreaPaint((node, color, ctx) => {
                    const r = node.group === 'core' ? 8 : 5;
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, r + 8, 0, 2 * Math.PI, false);
                    ctx.fillStyle = color;
                    ctx.fill();
                })
                .linkColor(() => '#ccc')
                .linkDirectionalParticles(2)
                .linkDirectionalParticleSpeed(0.005)
                .onNodeClick(node => {
                    if (node.url) window.location.href = node.url;
                });
        }
